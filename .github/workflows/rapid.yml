# Nivelul rapid (PLAN.md §4.4): la fiecare push, ≤ 5 minute. Un roșu blochează commit-ul următor.
# Commit-urile care ating doar .md nu-l pornesc.
# Testele unitare rulează în 4 felii paralele (`--test-shard`, pe fișiere): pe un singur job ajunseseră la 452 s din cele
# 600 permise (felia 2.5b), iar oracolul feliei 2.5c le-ar fi dus peste; din 2.6 (oracolul documentului v8 și al
# degajărilor) sunt 4 felii, ca fiecare să rămână sub 5 minute. Din 3.6c, 6: fișierele se împart după poziția lor în listă,
# deci trei fișiere noi au adus în felia 4 teste grele (peste 10 minute, oprită de limită). Fiecare push rulează tot; restul
# pașilor, o dată.
# `--test-shard` trebuie să stea ÎNAINTEA fișierelor: după ele, Node îl ignoră pe tăcute (măsurat pe 10.10).
name: rapid

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: rapid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapid:
    name: Nivelul rapid (felia ${{ matrix.felia }} din 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        felia: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Funcțiile (ADR 0039) au propriul package.json: tipurile lor și licențele lor de rulare cer dependențele instalate.
      - name: Dependențele funcțiilor
        if: matrix.felia == 1
        run: npm --prefix functions ci
      - name: Tipurile (tsc)
        if: matrix.felia == 1
        run: npm run typecheck
      - name: Tipurile funcțiilor (tsc)
        if: matrix.felia == 1
        run: npm run typecheck:functii
      - name: Regulile de import, cu capcanele
        if: matrix.felia == 1
        run: npm run importuri
      - name: Testele unitare (felia ${{ matrix.felia }} din 6)
        run: npm run test:felie
        env:
          FELIA: ${{ matrix.felia }}/6
      - name: Build-ul determinist și mărimea pachetului
        if: matrix.felia == 1
        run: npm run determinism
      - name: Licențele dependențelor de rulare
        if: matrix.felia == 1
        run: npm run licente

  # Exportul 2D (ADR 0088, ADR 0089): corpusul scris de aplicație, recitit de cititori independenți, doar pentru test (ezdxf
  # pentru DXF, PyMuPDF pentru PDF, Ghostscript pentru EPS), și comparat cu valorile pe hârtie din `test/oracles-py/export2d.py`.
  # Job separat, cu limita lui: pe 27.10, în felia 2 (după unitarele ei, 6 min 48 s), `apt` a dus felia la limita de 10 minute.
  # `apt-get update` întâi: cu indexul imaginii, pachetele Ghostscript nu se mai găseau pe oglinzi.
  oracol-export2d:
    name: Oracolul exportului 2D (ezdxf, PyMuPDF, Ghostscript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ghostscript și cititorii Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript > /dev/null
          python -m pip install --quiet -r test/oracles-py/requirements.txt
      - name: Corpusul, recitit și comparat cu hârtia
        run: |
          node scripts/export2d-corpus.ts .tmp/export2d
          gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=pdfwrite -dCompressPages=false -sOutputFile=.tmp/export2d/corpus-eps.pdf .tmp/export2d/corpus.eps
          python test/oracles-py/export2d.py .tmp/export2d
      # Importul EPS și AI ≤ 8 (ADR 0115), pe aceleași unelte: generatorul trece fiecare fișier al corpusului prin Ghostscript
      # și îl recitește cu PyMuPDF față de hârtie; fișierele regenerate trebuie să fie chiar cele comise (`test/fixtures/eps`).
      - name: Corpusul importului EPS, prin Ghostscript, egal cu cel comis
        run: |
          python test/oracles-py/eps_import_corpus.py .tmp/eps-corpus
          diff -r .tmp/eps-corpus test/fixtures/eps
