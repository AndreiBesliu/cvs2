# Nivelul complet (PLAN.md §4.4): în fiecare noapte și înaintea fiecărui deploy pe test (pornit de mână).
# O sesiune nouă începe cu starea ultimei rulări de aici: nicio rulare în 26 de ore înseamnă roșu.
name: complet

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complet:
    name: Nivelul complet
    runs-on: ubuntu-24.04
    # Testele unitare, nefeliate aici, trec de 10 minute pe mașina CI-ului din felia 2.5c (oracolul intrărilor cu rampă).
    # 24.10: nivelul rapid singur ia 14–24 min după runner, iar tot job-ul ajunsese la 29,3 min (20.10, verde); o rulare
    # mai lentă a fost oprită la 30 min în ultimul pas. Noaptea nu e grăbită: 60 de minute.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Dependențele funcțiilor
        run: npm --prefix functions ci
      - name: Nivelul rapid
        run: npm run rapid
      - name: Edge, pentru e2e
        run: npx playwright install --with-deps msedge
      - name: Build-ul servit
        run: npm run build
      - name: E2e pe dist/, în Edge
        run: npm run e2e
      # Emulatoarele Auth, Firestore și Functions (ADR 0039, 0040): jurnalul de erori, regulile, callable-urile și pagina
      # /admin cap-coadă (în Edge, pe dist/). Firestore cere Java ≥ 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Firebase CLI, fixat
        run: npm install -g firebase-tools@15.18.0
      - name: Testele pe emulatoare
        run: npm run test:emulator
