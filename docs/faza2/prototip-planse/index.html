<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototip planșe A/D</title>
<link rel="icon" href="data:,">
<meta name="description" content="Prototip clicabil, aruncabil: variantele A și D ale sistemului de planșe, pe cele 8 scenarii din LECTII.md §5.7. Fără motor CAM, fără rețea.">
<style>
:root{
  --bg:#f3f0e8; --panel:#ffffff; --panel-2:#f7f4ee; --ink:#1e1b16; --muted:#6a6458; --line:#dcd5c8;
  --accent:#1f5fd1; --accent-soft:rgba(31,95,209,.10); --on-accent:#ffffff;
  --warn:#b45309; --danger:#c62828; --ok:#2e7d32; --violet:#7c3aed; --ghost:#0f766e;
  --canvas:#e6e1d6; --wood:#e9d5b0; --wood-edge:#9c7b4f; --part:#f6e9cf; --part-edge:#2a241c;
  --groove:#1f5fd1; --pocket:rgba(31,95,209,.28); --pocket-edge:#1f5fd1; --engrave:#3a2d1f; --engrave-fill:rgba(58,45,31,.10);
  --relief1:#a56a32; --relief2:#f6dcae; --drill:#6d2a12; --pin:#0f766e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151410; --panel:#1f1d18; --panel-2:#27241e; --ink:#ede8dd; --muted:#a8a091; --line:#3b372f;
    --accent:#6ea2ff; --accent-soft:rgba(110,162,255,.14); --on-accent:#0b1220;
    --warn:#f59e0b; --danger:#f87171; --ok:#4ade80; --violet:#b69cff; --ghost:#2dd4bf;
    --canvas:#23211c; --wood:#5c4a30; --wood-edge:#c6a26c; --part:#735e3f; --part-edge:#f3ead8;
    --groove:#8fb6ff; --pocket:rgba(143,182,255,.30); --pocket-edge:#8fb6ff; --engrave:#fff4de; --engrave-fill:rgba(255,244,222,.10);
    --relief1:#d9a86e; --relief2:#7a5630; --drill:#fca5a5; --pin:#2dd4bf;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#151410; --panel:#1f1d18; --panel-2:#27241e; --ink:#ede8dd; --muted:#a8a091; --line:#3b372f;
  --accent:#6ea2ff; --accent-soft:rgba(110,162,255,.14); --on-accent:#0b1220;
  --warn:#f59e0b; --danger:#f87171; --ok:#4ade80; --violet:#b69cff; --ghost:#2dd4bf;
  --canvas:#23211c; --wood:#5c4a30; --wood-edge:#c6a26c; --part:#735e3f; --part-edge:#f3ead8;
  --groove:#8fb6ff; --pocket:rgba(143,182,255,.30); --pocket-edge:#8fb6ff; --engrave:#fff4de; --engrave-fill:rgba(255,244,222,.10);
  --relief1:#d9a86e; --relief2:#7a5630; --drill:#fca5a5; --pin:#2dd4bf;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
textarea{width:100%;resize:vertical}
.muted{color:var(--muted)}
header.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:15px}
.brand span{font-size:12px}
.variant{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.variant button{border:0;border-radius:0;padding:7px 12px;background:var(--panel)}
.variant button[aria-checked="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chk{display:flex;gap:4px;align-items:center;font-size:13px}
.layout{flex:1;display:grid;grid-template-columns:310px minmax(0,1fr) 300px;min-height:0}
aside{background:var(--panel);overflow:auto;min-width:0}
aside.scen{border-right:1px solid var(--line);padding:10px 12px}
aside.insp{border-left:1px solid var(--line);padding:10px 12px}
main.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-right:auto}
#crumbs button{border:0;background:transparent;padding:2px 6px;border-radius:4px}
#crumbs button.cur{background:var(--accent-soft);font-weight:600}
#crumbs .sep{color:var(--muted)}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--panel-2);color:var(--muted)}
.chip.lit{border-color:var(--violet);color:var(--violet)}
.banner{padding:7px 10px;background:color-mix(in srgb,var(--violet) 14%,var(--panel));border-bottom:1px solid var(--violet);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.toolbar .sep{width:1px;background:var(--line);margin:0 2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg span{padding:5px 8px;font-size:13px;color:var(--muted)}
.seg button{border:0;border-radius:0}
.cvwrap{position:relative;flex:1;min-height:340px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--canvas);touch-action:none;user-select:none;-webkit-user-select:none}
.toast{cursor:pointer;position:absolute;left:10px;right:10px;bottom:10px;max-width:640px;margin:auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow);font-size:13px}
.status{padding:5px 10px;font-size:12px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);min-height:28px}
.status .w{color:var(--danger)}
h2{font-size:16px;margin:4px 0 6px}
h3{font-size:14px;margin:10px 0 6px}
h4{font-size:13px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.crit{font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.slist{list-style:none;padding:0;margin:0 0 8px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.slist button{width:100%;text-align:left;font-size:13px;padding:4px 7px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2)}
.card p{margin:6px 0}
.vtag{font-size:12px;font-weight:400;color:var(--muted)}
.card details{font-size:13px;margin:6px 0}
.card textarea{min-height:90px}
.conc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px}
.conc .c{border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--panel)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.f{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center;margin:4px 0;font-size:13px}
.f input,.f select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.anch{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.anch button{width:26px;height:22px;padding:0;font-size:11px}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.box{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;background:var(--panel-2)}
.box.violet{border-color:var(--violet)}
ul.plain{list-style:none;padding:0;margin:4px 0}
ul.plain li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:min(560px,94vw);padding:14px 16px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:12px 0 0}
dialog table{border-collapse:collapse;font-size:12px;width:100%}
dialog td,dialog th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
/* svg */
#cv .sheet{fill:var(--wood);stroke:var(--wood-edge);stroke-width:1.2px;vector-effect:non-scaling-stroke}
#cv .sheet.drop{stroke:var(--accent);stroke-width:3px}
#cv .sheet.on{stroke:var(--accent);stroke-width:2.5px}
#cv .sheet-label{fill:var(--ink);font-family:system-ui,"Segoe UI",sans-serif;cursor:pointer}
#cv .sheet-label.on{fill:var(--accent);font-weight:700}
#cv .o{fill:var(--part);stroke:var(--part-edge);stroke-width:1.6px;vector-effect:non-scaling-stroke}
#cv .ring{fill:none;stroke-width:1.3px;vector-effect:non-scaling-stroke}
#cv .sh{vector-effect:non-scaling-stroke;stroke-width:1.3px;pointer-events:all}
#cv .role-cut.sh{fill:var(--part);stroke:var(--part-edge);stroke-width:1.6px}
#cv .role-groove{fill:none;stroke:var(--groove);stroke-dasharray:6 3}
#cv .sh.role-groove{pointer-events:none}
#cv .role-pocket{fill:var(--pocket);stroke:var(--pocket-edge)}
#cv .role-engrave{fill:var(--engrave-fill);stroke:var(--engrave)}
#cv text.sh{fill:var(--engrave);stroke:none;text-anchor:middle;dominant-baseline:central;font-family:system-ui,"Segoe UI",sans-serif;font-weight:600}
#cv text.sh.long{fill:var(--danger)}
#cv .role-relief{fill:url(#gRelief);stroke:var(--relief1)}
#cv .role-drill{fill:var(--drill);stroke:var(--drill)}
#cv .role-pin{fill:none;stroke:var(--pin);stroke-width:2px}
#cv .hit{fill:transparent;stroke:none;pointer-events:all}
#cv .hitstroke{fill:none;stroke:transparent;stroke-width:10px;vector-effect:non-scaling-stroke;pointer-events:stroke}
#cv .dim{opacity:.28}
#cv .face-through{opacity:.45;stroke-dasharray:3 3;fill-opacity:.25}
#cv .face-other{opacity:.25}
#cv .pin circle{fill:var(--panel);stroke:var(--pin);stroke-width:2px;vector-effect:non-scaling-stroke}
#cv .pin path{stroke:var(--pin);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#cv .flipaxis{stroke:var(--pin);stroke-width:1px;stroke-dasharray:8 5;vector-effect:non-scaling-stroke}
#cv .selbox{fill:none;stroke:var(--accent);stroke-width:1.6px;vector-effect:non-scaling-stroke}
#cv .sib{fill:none;stroke:var(--violet);stroke-width:1.6px;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
#cv .handle{fill:var(--panel);stroke:var(--accent);stroke-width:1.4px;vector-effect:non-scaling-stroke;cursor:pointer}
#cv .handle.multi{stroke:var(--violet);fill:var(--violet)}
#cv .warnbox{fill:none;stroke:var(--danger);stroke-width:1.6px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#cv .warnbox.warn{stroke:var(--warn);fill:color-mix(in srgb,var(--warn) 18%,transparent)}
#cv .wlabel{fill:var(--danger);font-family:system-ui,sans-serif;font-weight:600}
#cv .wlabel.warn{fill:var(--warn)}
#cv .aline{stroke:var(--ghost);stroke-width:1.2px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;fill:none}
#cv .adot{fill:var(--ghost)}
#cv .alabel{fill:var(--ghost);font-family:system-ui,sans-serif;font-weight:600}
#cv .ghost{fill:none;stroke:var(--ghost);stroke-width:1.6px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#cv .glabel{fill:var(--ghost);font-family:system-ui,sans-serif;font-weight:700}
#cv .marq{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#cv .hatch{stroke:var(--pocket-edge);stroke-width:.6px;vector-effect:non-scaling-stroke}
@media (max-width:980px){
  body{display:block;height:auto;min-height:100vh}
  .layout{display:flex;flex-direction:column}
  aside{overflow:visible}
  aside.scen{border-right:0;border-bottom:1px solid var(--line);order:1}
  main.stage{order:2}
  aside.insp{border-left:0;border-top:1px solid var(--line);order:3}
  .cvwrap{flex:none;height:62vh;min-height:300px}
  .brand{margin-right:0;width:100%}
  .brand span{display:none}
  header.top{padding:6px 10px;gap:6px 10px}
}
</style>

<body>
<header class="top">
  <div class="brand"><b>Prototip planșe: A sau D?</b><span class="muted">CNC Vector Studio 2 · aruncabil · fără motor CAM, fără rețea</span></div>
  <div class="variant" role="radiogroup" aria-label="Varianta">
    <button id="vA" role="radio" data-variant="A" aria-checked="true">A · Planșa e pânza</button>
    <button id="vD" role="radio" data-variant="D" aria-checked="false">D · Piese pe foi</button>
  </div>
  <div class="tools">
    <button id="bUndo" title="Anulează (Ctrl+Z)" aria-label="Anulează">↶</button>
    <button id="bRedo" title="Refă (Ctrl+Y)" aria-label="Refă">↷</button>
    <button id="bFit" title="Arată tot">Încadrează</button>
    <label class="chk" title="Mutările se lipesc din 5 în 5 mm pe planșă/foaie și din 1 în 1 mm înăuntru"><input type="checkbox" id="cSnap" checked> Lipire la grilă</label>
    <button id="bHelp">Gesturi</button>
  </div>
</header>
<div class="layout">
  <aside class="scen" id="scen" aria-label="Scenarii"></aside>
  <main class="stage">
    <div class="crumbs"><nav id="crumbs" aria-label="Unde ești"></nav><span id="level2" class="chip"></span></div>
    <div id="banner" class="banner" hidden></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="cvwrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-label="Pânza"></svg><div id="toast" class="toast" hidden role="status"></div></div>
    <div id="status" class="status"></div>
  </main>
  <aside class="insp" aria-label="Proprietăți"><div id="insp"></div><div id="lib"></div></aside>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<noscript>Prototipul are nevoie de JavaScript.</noscript>
<script>
(function () {
'use strict';
/* ============ 0. Unelte mici ============ */
const $ = (s, el) => (el || document).querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const r2 = v => Math.round(v * 100) / 100;
const r1 = v => Math.round(v * 10) / 10;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; };
const plur = (n, one, many) => n === 1 ? '1 ' + one : n + ' ' + ((n !== 0 && (n % 100 === 0 || n % 100 >= 20)) ? 'de ' : '') + many;
const Mx = {
  t: (x, y) => [1, 0, 0, 1, x, y],
  s: (x, y) => [x, 0, 0, y, 0, 0],
  r: d => { const a = d * Math.PI / 180; const c = Math.round(Math.cos(a) * 1e9) / 1e9, s = Math.round(Math.sin(a) * 1e9) / 1e9; return [c, s, -s, c, 0, 0]; },
  mul: (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]],
  inv: m => { const d = m[0] * m[3] - m[1] * m[2]; return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; },
  ap: (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]],
  str: m => 'matrix(' + m.map(v => +(+v).toFixed(5)).join(' ') + ')',
};
function aabb(m, b) {
  const p = [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].map(q => Mx.ap(m, q[0], q[1]));
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]); const x = Math.min(...xs), y = Math.min(...ys);
  return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
}
function union(a, b) { if (!a) return b; if (!b) return a; const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y); return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y }; }
function interBox(a, b) { const x = Math.max(a.x, b.x), y = Math.max(a.y, b.y); const w = Math.min(a.x + a.w, b.x + b.w) - x, h = Math.min(a.y + a.h, b.y + b.h) - y; return (w > 0.05 && h > 0.05) ? { x, y, w, h } : null; }

/* ============ 1. Cuvintele ============ */
const VOC = {
  A: { sheet: 'Planșa', sheetN: 'planșă', sheetLc: 'planșa', sheets: 'Planșe', all: 'Toate planșele', concept: 'Planșă', newSheet: '+ Planșă' },
  D: { sheet: 'Foaia', sheetN: 'foaie', sheetLc: 'foaia', sheets: 'Foi', all: 'Toate foile', concept: 'Foaie', newSheet: '+ Foaie' },
};
const ROLES = { cut: 'Tăiere (contur)', groove: 'Canelură', pocket: 'Buzunar', engrave: 'Gravare', relief: 'Relief', drill: 'Găurire', pin: 'Știft de aliniere' };
const ANCH = ['nw', 'n', 'ne', 'w', 'c', 'e', 'sw', 's', 'se'];
const ANCH_RO = { nw: 'colțul stânga-sus', n: 'marginea de sus (centrat)', ne: 'colțul dreapta-sus', w: 'marginea din stânga (centrat)', c: 'centru', e: 'marginea din dreapta (centrat)', sw: 'colțul stânga-jos', s: 'marginea de jos (centrat)', se: 'colțul dreapta-jos' };
const ANCH_SYM = { nw: '↖', n: '↑', ne: '↗', w: '←', c: '•', e: '→', sw: '↙', s: '↓', se: '↘' };

/* ============ 2. Constructori de noduri ============ */
const estW = (s, size) => r2(Math.max(size * 0.8, 0.6 * size * [...String(s)].length));
function T(id, name, cx, cy, text, size, ex) { const w = estW(text, size), h = r2(size * 1.25); return Object.assign({ id, type: 'text', name, x: r2(cx - w / 2), y: r2(cy - h / 2), w, h, text, size, role: 'engrave' }, ex || {}); }
function Rc(id, name, x, y, w, h, role, ex) { return Object.assign({ id, type: 'rect', name, x, y, w, h, r: 0, role }, ex || {}); }
function El(id, name, cx, cy, w, h, role, ex) { return Object.assign({ id, type: 'ellipse', name, x: r2(cx - w / 2), y: r2(cy - h / 2), w, h, role }, ex || {}); }
function G(id, name, x, y, children, ex) { return Object.assign({ id, type: 'group', name, x, y, children }, ex || {}); }
function F(id, name, w, h, r, insets, children, ex) { return Object.assign({ id, type: 'group', name, x: 0, y: 0, w, h, role: 'cut', frame: { r, insets }, children }, ex || {}); }
function setTextGeom(n, keep) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2, x0 = n.x, y0 = n.y;
  n.w = estW(n.text, n.size); n.h = r2(n.size * 1.25);
  if (keep === 'tl') { n.x = x0; n.y = y0; } else { n.x = r2(cx - n.w / 2); n.y = r2(cy - n.h / 2); }
}

/* ============ 3. Scenariile (din LECTII.md §5.7) ============ */
const CSV30 = ['nume', 'Ana', 'Andrei', 'Bianca', 'Cristian', 'Diana', 'Elena', 'Florin', 'Gabriela', 'Horia', 'Ioana', 'Ionuț', 'Larisa', 'Mihai', 'Mara', 'Nicoleta', 'Ovidiu', 'Paula', 'Radu', 'Sorina', 'Tudor', 'Ștefan', 'Teodora', 'Vlad', 'Valentina', 'Adrian', 'Carmen', 'Dan', 'Irina', 'Marius', 'Oana'].join('\n');
const plate1 = (txt) => F('placuta', 'Plăcuță', 300, 200, 12, [{ d: 10, role: 'groove' }], [
  T('text', 'Text', 150, 108, txt || 'Bine ați venit', 24, { anchor: 'c' }),

function pick(e) {

    const p = dp.split('/'); const u = unitAt(st, p);

    const b = unitWorldBBox(st, u); const area = b ? b.w * b.h : Infinity;
    if (!inside || area < inside.area - 1e-6) inside = { unit: u, path: p, area };
  }

}
const snapStep = st => $('#cSnap').checked ? (!st.ctx.length ? 5 : 1) : 0;
function sheetAtWorld(doc, wx, wy) { for (const v of views(doc)) if (v.kind === 'top' && wx >= v.ox && wx <= v.ox + v.sheet.w && wy >= v.oy && wy <= v.oy + v.sheet.h) return v.sheet.id; return null; }

}

  // Dublu-clicul e detectat aici, nu din evenimentul „dblclick”: pânza se redesenează la apăsare,

window.addEventListener('pointermove', e => {

  if (d.mode === 'pan') { if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 3) d.click = false; UI.view.x = d.vx - (e.clientX - d.sx) / UI.view.k; UI.view.y = d.vy - (e.clientY - d.sy) / UI.view.k; setViewBox(); return; }
  const [wx, wy] = c2w(e.clientX, e.clientY);
  if (d.mode === 'move') {
    if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 3) return; d.moved = true;
    let dx, dy;
    if (!st.ctx.length) { dx = wx - d.wx; dy = wy - d.wy; } else { const mi = Mx.inv(pathMatrix(st.doc, st.ctx)); const a = Mx.ap(mi, d.wx, d.wy), b = Mx.ap(mi, wx, wy); dx = b[0] - a[0]; dy = b[1] - a[1]; }
    const g = snapStep(st); if (g) { dx = Math.round((d.bx + dx) / g) * g - d.bx; dy = Math.round((d.by + dy) / g) * g - d.by; }
    for (const u of st.sel) { const p0 = d.start[u]; if (p0) setUnitPos(st, u, p0.x + dx, p0.y + dy); }
    d.drop = !st.ctx.length ? sheetAtWorld(st.doc, wx, wy) : null;

  }
  if (d.mode === 'resize') {
    d.moved = true; const doc = st.doc; let px, py;
    if (!st.ctx.length) { const v = topView(doc, d.sheetId); px = wx - v.ox; py = wy - v.oy; } else { const p = Mx.ap(Mx.inv(pathMatrix(doc, st.ctx)), wx, wy); px = p[0]; py = p[1]; }
    const g = snapStep(st); if (g) { px = Math.round(px / g) * g; py = Math.round(py / g) * g; }
    const b = d.b0; let x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h;
    if (d.h.includes('w')) x1 = Math.min(px, x2 - 1); if (d.h.includes('e')) x2 = Math.max(px, x1 + 1);

});
window.addEventListener('pointerup', () => {
  const d = UI.drag; if (!d) return; UI.drag = null; const st = cur();
  if (d.mode === 'pan') { if (d.click) { st.sel = []; st.sheetSel = null; st.ctx = []; render(); } return; }
  if (d.mode === 'move') {
    if (d.moved) {

          const f = findPl(st.doc, u); if (!f) continue; const v = topView(st.doc, f.sheet.id); const b = plBBox(st.doc, f.pl);
          const to = sheetAtWorld(st.doc, b.x + b.w / 2 + v.ox, b.y + b.h / 2 + v.oy);
          if (to && to !== f.sheet.id) { const tv = topView(st.doc, to); f.sheet.items.splice(f.sheet.items.indexOf(f.pl), 1); f.pl.x = r2(f.pl.x + v.ox - tv.ox); f.pl.y = r2(f.pl.y + v.oy - tv.oy); tv.sheet.items.push(f.pl); useConcept(VOC[st.doc.v].concept); toast('Mutat pe ' + tv.sheet.name + '.'); }
        }
      } else finishMoveRules(st, st.sel);
      st.undo.push(d.snap); st.redo = [];
    }
    render(); return;
  }
  if (d.mode === 'resize') {
    if (d.moved) { st.undo.push(d.snap); st.redo = []; const n = unitRef(st.doc, st.ctx, d.u); if (n && n.node.frame) useConcept('Ramă'); }
    render(); return;
  }
  if (d.mode === 'marquee') {

    else {
      const m = { x: Math.min(d.wx, d.x2), y: Math.min(d.wy, d.y2), w: Math.abs(d.x2 - d.wx), h: Math.abs(d.y2 - d.wy) };
      const units = !st.ctx.length ? allPls(st.doc).map(o => o.pl.id) : resolve(st.doc, st.ctx).node.children.map(c => c.id);
      st.sel = units.filter(u => { const b = unitWorldBBox(st, u); return b && interBox(b, m); }); st.sheetSel = null;

});
svg.addEventListener('wheel', e => {
  e.preventDefault(); const [wx, wy] = c2w(e.clientX, e.clientY); const f = Math.exp(-e.deltaY * 0.0015);
  const k = Math.min(60, Math.max(0.05, UI.view.k * f)); const r = svg.getBoundingClientRect();
  UI.view.k = k; UI.view.x = wx - (e.clientX - r.left) / k; UI.view.y = wy - (e.clientY - r.top) / k; renderSVG();
}, { passive: false });
document.addEventListener('keydown', e => {
  UI.lastDown = null; // o tastă între două clicuri nu mai face din ele un dublu-clic
  if (dlg.open) return;
  const t = e.target; const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (e.key === 'Escape') { if (typing) { if ('defaultValue' in t && t.tagName === 'INPUT') t.value = t.defaultValue; t.blur(); UI.ghost = null; render(); return; } e.preventDefault(); escapeLevel(); return; }
  if (typing) return;
  const mod = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
  if (e.key === ' ') { UI.space = true; e.preventDefault(); return; }
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  else if (mod && k === 'd') { e.preventDefault(); duplicate(); }
  else if (mod && k === 'g') { e.preventDefault(); if (e.shiftKey) ungroupSel(); else groupSel(); }
  else if (mod && k === 'a') { e.preventDefault(); selectAll(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(); }
  else if (!mod && k === 'r') { e.preventDefault(); rotateSel(); }
  else if (e.key.startsWith('Arrow')) { e.preventDefault(); const s = e.shiftKey ? 10 : 1; nudge(e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0); }
});
document.addEventListener('keyup', e => { if (e.key === ' ') UI.space = false; });

/* ============ 13. Butoanele și câmpurile ============ */
function act(a, el) {
  const st = cur();
  switch (a) {
    case 'ins-rect': return insertShape('rect');
    case 'ins-ellipse': return insertShape('ellipse');
    case 'ins-text': return insertShape('text');
    case 'group': return groupSel();
    case 'ungroup': return ungroupSel();
    case 'arrange': return arrange();
    case 'more': return askMore();
    case 'csv': return askCsv();
    case 'add-sheet': return addSheet();
    case 'mirror-sheet': return mirrorSheetA();
    case 'face-fata': return setFace('fata');
    case 'face-spate': return setFace('spate');
    case 'unflip': return commit(doc => { const sh = doc.sheets.find(s => s.id === st.sheetSel); if (!sh) return false; sh.flip = null; if (!doc.sheets.some(s => s.flip)) doc.face = 'fata'; });
    case 'del-sheet': return delSheet(st.sheetSel);
    case 'dup': return duplicate();
    case 'del': return del();
    case 'rot': return rotateSel();
    case 'sheet-sel': st.sheetSel = el.getAttribute('data-sheet'); st.sel = []; st.ctx = []; useConcept(VOC[st.doc.v].concept); return render();
    case 'part-edit': if (st.sel.length === 1 && !st.ctx.length) enterUnit(st.sel[0], null); return;
    case 'detach': if (st.sel.length === 1 && !st.ctx.length) detach(st.sel[0]); return;
    case 'detach-ctx': if (st.ctx.length) detach(st.ctx[0]); return;
    case 'lib-edit': { const pid = el.getAttribute('data-part'); const o = allPls(st.doc).find(x => x.pl.partId === pid); if (o) { st.ctx = []; st.sel = [o.pl.id]; enterUnit(o.pl.id, null); } return; }
    case 'lib-add': return addInstance(el.getAttribute('data-part'));
    case 'anchor': { const a2 = el.getAttribute('data-a'); return commit(doc => { const ref = unitRef(doc, st.ctx, st.sel[0]); if (!ref) return false; ref.node.anchor = a2; ref.node.anchorManual = true; }); }
    case 'ins-add': return commit(doc => { const ref = unitRef(doc, st.ctx, st.sel[0]); if (!ref || !ref.node.frame) return false; const last = ref.node.frame.insets[ref.node.frame.insets.length - 1]; ref.node.frame.insets.push({ d: last ? last.d + 10 : 10, role: 'groove' }); });
    case 'ins-del': { const i = +el.getAttribute('data-i'); return commit(doc => { const ref = unitRef(doc, st.ctx, st.sel[0]); if (!ref || !ref.node.frame) return false; ref.node.frame.insets.splice(i, 1); }); }
    case 'reset': { UI.states[skey(UI.v, UI.scen)] = fresh(UI.v, UI.scen); UI.ghost = null; renderScen(); render(); fit(); renderSVG(); return toast('Scenariul ' + UI.scen + ' pornește din nou (varianta ' + UI.v + ').'); }

}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-act]'); if (b && !b.disabled && !b.closest('dialog')) { act(b.getAttribute('data-act'), b); return; }
  const s = e.target.closest && e.target.closest('[data-scen]'); if (s) { UI.scen = +s.getAttribute('data-scen'); UI.ghost = null; renderScen(); render(); fit(); renderSVG(); return; }
  const v = e.target.closest && e.target.closest('[data-variant]'); if (v) { setVariant(v.getAttribute('data-variant')); return; }
  const c = e.target.closest && e.target.closest('#crumbs [data-lvl]'); if (c) { const st = cur(); const L = +c.getAttribute('data-lvl'); if (L < st.ctx.length) { const from = st.ctx[L]; st.ctx = st.ctx.slice(0, L); st.sel = [from]; st.sheetSel = null; UI.ghost = null; render(); } }
});
function applyField(f, raw) {
  const st = cur(); UI.ghost = null;
  if (st.sheetSel) {
    return commit(doc => { const sh = doc.sheets.find(s => s.id === st.sheetSel); if (!sh) return false; if (f === 'name') { sh.name = String(raw).trim() || sh.name; return; } const v = num(raw); if (!(v > 0)) return false; if (f === 'w') sh.w = v; else if (f === 'h') sh.h = v; else if (f === 't') sh.t = v; else return false; if (sh.flip) { sh.flip.pins = [{ x: r2(sh.w / 2), y: 25, d: 8 }, { x: r2(sh.w / 2), y: r2(sh.h - 25), d: 8 }]; } useConcept(VOC[doc.v].concept); });
  }
  if (st.sel.length !== 1) return;
  const u = st.sel[0];
  commit(doc => {
    const ref = unitRef(doc, st.ctx, u); if (!ref) return false; const n = ref.node; const b = unitBBox(st, u);
    if (f === 'x' || f === 'y') { const v = num(raw); if (!isFinite(v)) return false; setUnitTopLeft(st, u, f === 'x' ? v : b.x, f === 'y' ? v : b.y); if (!ref.root) finishMoveRules(st, [u]); return; }
    if (f === 'w' || f === 'h') { const v = num(raw); if (!(v > 0)) return false; applyBox(st, u, clone(n), b, { x: b.x, y: b.y, w: f === 'w' ? v : b.w, h: f === 'h' ? v : b.h }, f === 'w' ? 'e' : 's'); if (n.frame) useConcept('Ramă'); return; }
    if (f === 'text') { if (String(raw) === n.text) return false; n.text = String(raw); setTextGeom(n); return; }
    if (f === 'size') { const v = num(raw); if (!(v > 0)) return false; n.size = v; setTextGeom(n); return; }
    if (f === 'role') { n.role = raw; if (raw === 'pin') useConcept('Știft'); return; }
    if (f === 'face') { n.face = raw; if (raw === 'spate') useConcept('Fața de jos'); return; }
    if (f === 'sheet') { const to = doc.sheets.find(s => s.id === raw); if (!to || to === ref.sheet) return false; ref.sheet.items.splice(ref.sheet.items.indexOf(ref.pl), 1); to.items.push(ref.pl); useConcept(VOC[doc.v].concept); return; }

}
const insp = $('#insp');
insp.addEventListener('change', e => { const f = e.target.getAttribute('data-f'); if (f) applyField(f, e.target.value); });
insp.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = e.target.getAttribute('data-f'); if (f && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); } } });
insp.addEventListener('input', e => {
  const f = e.target.getAttribute('data-f'); if (f !== 'w' && f !== 'h') return;
  const st = cur(); if (st.sel.length !== 1) return; const ref = unitRef(st.doc, st.ctx, st.sel[0]); if (!ref || !ref.node.frame) return;
  const v = num(e.target.value); if (!(v > 0)) return;

function setVariant(v) {

  $('#vA').setAttribute('aria-checked', String(v === 'A')); $('#vD').setAttribute('aria-checked', String(v === 'D'));
  renderScen(); render(); fit(); renderSVG();
}

$('#bFit').addEventListener('click', () => { fit(); renderSVG(); });
$('#bHelp').addEventListener('click', showHelp);
$('#toast').addEventListener('click', () => { $('#toast').hidden = true; });
window.addEventListener('resize', () => { setViewBox(); renderSVG(); });

/* ============ 14. Totul împreună ============ */
function layoutSig(doc) { return UI.v + UI.scen + '|' + doc.sheets.map(s => s.id + ':' + s.w + 'x' + s.h + (s.flip ? 'f' : '')).join('|'); }
function render() {
  renderSVG(); renderCrumbs(); renderBanner(); renderToolbar(); inspector(); library(); renderStatus(); renderConcepts();
  const sig = layoutSig(cur().doc); if (sig !== UI.sig) { UI.sig = sig; fit(); renderSVG(); } // foaie nouă, mărime nouă sau fața de jos: arată tot
}

/* Cârlige pentru testele Playwright: doar citire și coordonate, fără scurtături de gesturi. */
function countNodes(doc) { let n = 0; const cnt = r => walk(r, () => { n++; }, []); if (doc.v === 'A') allPls(doc).forEach(o => cnt(o.pl.node)); else Object.values(doc.parts).forEach(p => cnt(p.root)); return n; }
window.__proto = {
  summary() {
    const st = cur(), doc = st.doc;
    const texts = (r, pl) => { const out = []; walk(r, n => { if (n.type === 'text') out.push(textOf(doc, n, pl)); }, []); return out; };
    return {
      v: doc.v, scen: UI.scen, ctx: st.ctx.slice(), sel: st.sel.slice(), sheetSel: st.sheetSel, showInst: !!doc.show.inst, why: doc.show.why, face: doc.face,
      crumbs: $('#crumbs').textContent, banner: $('#banner').hidden ? '' : $('#banner').textContent, lib: $('#lib').hidden ? '' : $('#lib').textContent, chip: $('#level2').textContent,
      sheets: doc.sheets.map(sh => ({ id: sh.id, name: sh.name, w: sh.w, h: sh.h, flip: !!sh.flip, pins: sh.flip ? sh.flip.pins.map(p => ({ x: p.x, y: p.y })) : [],
        items: sh.items.map(pl => { const b = plBBox(doc, pl); return { id: pl.id, x: r2(pl.x), y: r2(pl.y), rot: pl.rot || 0, mx: !!pl.mx, partId: pl.partId || null, fields: pl.fields ? clone(pl.fields) : null, bbox: { x: r2(b.x), y: r2(b.y), w: r2(b.w), h: r2(b.h) }, texts: texts(rootOf(doc, pl), pl) }; }) })),
      parts: doc.v === 'D' ? Object.values(doc.parts).map(p => ({ id: p.id, name: p.name, count: instCount(doc, p.id) })) : [],
      nodes: countNodes(doc), placements: allPls(doc).length, concepts: st.concepts.slice(), warnings: [...new Set((st.warn || []).map(w => w.msg))], toast: st.toast,

  },
  node(path) { const r = resolve(cur().doc, path); return r ? clone(r.node) : null; },
  part(partId) { const p = cur().doc.parts[partId]; return p ? clone(p) : null; },
  /* punctul (lx, ly) din spațiul de coordonate al copiilor nodului de la `path`, în lume / pe ecran */
  worldOf(path, lx, ly, kind) { const doc = cur().doc; const r = resolve(doc, path); if (!r) return null; const vw = views(doc).find(v => v.sheet.id === r.sheet.id && v.kind === (kind || 'top')); return Mx.ap(pathMatrix(doc, path, vw), lx, ly); },
  clientOf(path, lx, ly, kind) { const w = this.worldOf(path, lx, ly, kind); return w ? w2c(w[0], w[1]) : null; },
  clientOfSheet(sid, x, y, kind) { const doc = cur().doc; const v = views(doc).find(q => q.sheet.id === sid && q.kind === (kind || 'top')); const p = Mx.ap(v.m, x, y); return w2c(p[0], p[1]); },
  clientOfWorld(x, y) { return w2c(x, y); },
  k() { return UI.view.k; },
  notesText,
  lastCopy() { return UI.lastCopy; },
};

renderScen(); render(); fit(); renderSVG();
})();
